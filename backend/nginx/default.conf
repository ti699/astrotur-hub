# Substitua api.seudominio.com.br pelo seu domínio.
# Passo 1: emita o certificado com `certbot --standalone` (veja o README) antes de subir o Nginx.
# Passo 2: suba o stack; o bloco 443 abaixo usa o certificado emitido.

server {
  listen 80;
  server_name api.seudominio.com.br;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.seudominio.com.br;

  ssl_certificate     /etc/letsencrypt/live/api.seudominio.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.seudominio.com.br/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 1m;

  location / {
    proxy_pass http://api:3002;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
